name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily smoke check against the deployed app at 12:00 UTC.
    - cron: "0 12 * * *"

jobs:
  test:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    # instant-attorney is a standalone npm project (deliberately excluded from the
    # pnpm workspace), so it is built and tested with npm from its own directory.
    defaults:
      run:
        working-directory: artifacts/instant-attorney
    # next.config.ts calls requireEnv() on these at config load, so `lint` and
    # `build` abort before doing any work unless they are set. They are
    # NEXT_PUBLIC_ (already public in the browser bundle), so they are repo
    # *variables*, not secrets.
    #
    # The fallbacks keep CI self-sufficient: neither step connects to Supabase,
    # they only need the values to exist and be well-formed. Set the repo
    # variables under Settings → Secrets and variables → Actions → Variables to
    # have CI build against the same values as production.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_placeholder' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: artifacts/instant-attorney/package-lock.json

      # The committed lockfile is the source of truth for the Replit publish/deploy
      # build, so we don't modify it. But it pins tarball URLs to Replit's
      # package-firewall proxy (unreachable from GitHub runners) and omits some
      # optional peer deps (@emnapi) that this npm expects, so a strict `npm ci`
      # can't run here. For CI only: rewrite the resolved URLs to the public npm
      # registry (integrity hashes are content-based, so they stay valid), then use
      # `npm install`, which tolerates the optional-dep gap. Neither change is
      # committed, so the deploy build is unaffected.
      - name: Point lockfile at public registry for CI install
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # Catches what nothing else here can, because neither typecheck nor the
      # unit tests ever touch a database: two migrations creating the same table
      # with different columns (the second `create table if not exists` silently
      # does nothing, and its code then writes to columns that were never
      # created), and code querying a table no migration defines.
      - name: Schema guard
        run: npm run schema:strict

      # Catches what typecheck cannot: bad route/segment config, server vs.
      # client component violations, and anything that only fails once Next
      # compiles the app for real.
      #
      # Retried because `next/font` fetches Google Fonts at build time, and a
      # transient fonts.gstatic.com failure fails the whole build. That is a
      # network flake, not a code defect — the same commit has passed and failed
      # in parallel runs. Self-hosting the font via next/font/local would remove
      # the dependency outright and is the real fix.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "::warning::build attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::build failed after 3 attempts"
          exit 1

  smoke:
    name: Smoke e2e (deployed app)
    # Only on a schedule or manual trigger — never on every push — so it doesn't
    # hammer the live app. It is AI-free, so it costs no Anthropic budget.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run smoke checks
        run: node artifacts/instant-attorney/scripts/e2e.mjs
        env:
          # Add these in GitHub: Settings -> Secrets and variables -> Actions.
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
