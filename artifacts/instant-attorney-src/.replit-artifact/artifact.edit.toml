kind = "web"
previewPath = "/"
title = "Instant-Attorney"
version = "1.0.0"

[[services]]
localPort = 3000
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/instant-attorney run dev"

[services.development.env]
PORT = "3000"
BYPASS_AUTH = "true"
NEXT_PUBLIC_BYPASS_AUTH = "true"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/instant-attorney", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/instant-attorney", "run", "start"]

[services.production.run.env]
PORT = "3000"
NODE_ENV = "production"
