kind = "web"
previewPath = "/"
title = "Instant-Attorney"
version = "1.0.0"
id = "artifacts/instant-attorney"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21203

[services.development]
run = "pnpm --filter @workspace/instant-attorney run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/instant-attorney", "run", "build" ]
publicDir = "artifacts/instant-attorney/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21203"
BASE_PATH = "/"
