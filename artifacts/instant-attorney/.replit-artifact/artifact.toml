kind = "web"
previewPath = "/"
title = "Instant-Attorney"
version = "1.0.0"
id = "artifacts/instant-attorney"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [
  "/",
  "/api/chat",
  "/api/chat-acp",
  "/api/wizard",
  "/api/attachments",
  "/api/documents",
  "/api/auth",
  "/api/subscriptions",
  "/api/agreements",
]
localPort = 21203

[services.development]
run = "npm run dev"

[services.development.cwd]
path = "artifacts/instant-attorney"

[services.env]
PORT = "21203"
BYPASS_AUTH = "true"
NEXT_PUBLIC_BYPASS_AUTH = "true"
