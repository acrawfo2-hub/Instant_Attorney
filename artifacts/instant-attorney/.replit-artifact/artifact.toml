kind = "web"
previewPath = "/"
title = "Instant-Attorney"
version = "1.0.0"
id = "artifacts/instant-attorney"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
# This app is the only service, so it owns every path. There used to be an
# Express api-server here holding the bare `/api` prefix, which forced this list
# to enumerate all 26 `/api/*` prefixes: the proxy matches most-specific first,
# so any prefix missing from the list fell through to Express and 404'd while
# typecheck and tests stayed green. That bit `/api/attorney`, `/api/workspace`,
# `/api/assess-matter`, and `/api/dropbox-sign` — the last three caught by a
# test written after the second incident.
#
# api-server served exactly one route (`GET /api/healthz`). Deleting it retires
# the whole failure mode rather than guarding it: with nothing else claiming a
# prefix, `/` catches everything and a new route under `app/api/` needs no
# registration anywhere. Do not reintroduce a second service on this domain
# without restoring the enumeration and its guard test.
paths = ["/"]
localPort = 21203

[services.development]
run = "npm run dev"

[services.development.cwd]
path = "artifacts/instant-attorney"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd artifacts/instant-attorney && npm run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["sh", "-c", "cd artifacts/instant-attorney && npm run start"]

[services.production.run.env]
PORT = "21203"
NODE_ENV = "production"

[services.production.health.startup]
path = "/login"

[services.env]
PORT = "21203"
