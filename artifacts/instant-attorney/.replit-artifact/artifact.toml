kind = "web"
previewPath = "/"
title = "Instant-Attorney"
version = "1.0.0"
id = "artifacts/instant-attorney"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [
  "/",
  "/api/chat",
  "/api/chat-acp",
  "/api/wizard",
  "/api/what-if",
  "/api/attachments",
  "/api/document-jobs",
  "/api/documents",
  "/api/gov-forms",
  "/api/auth",
  "/api/attorney",
  "/api/subscriptions",
  "/api/billing",
  "/api/agreements",
  "/api/consult",
  "/api/case-files",
  "/api/financials",
  "/api/account",
  "/api/usage",
  "/api/admin",
  "/api/family",
  "/api/bankruptcy",
  "/api/personal-injury",
  "/api/roadmap",
  # Added after lib/admin/api-surface.test.ts caught them missing: all three
  # have routes under app/api/ but were absent here, so the proxy handed them
  # to the Express api-server. /api/workspace is the orchestrator's draft side
  # panel and /api/assess-matter backs MatterStandingCard — both are called by
  # the client on normal pages.
  "/api/workspace",
  "/api/assess-matter",
  "/api/dropbox-sign",
  "/consult",
]
localPort = 21203

[services.development]
run = "npm run dev"

[services.development.cwd]
path = "artifacts/instant-attorney"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd artifacts/instant-attorney && npm run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["sh", "-c", "cd artifacts/instant-attorney && npm run start"]

[services.production.run.env]
PORT = "21203"
NODE_ENV = "production"

[services.production.health.startup]
path = "/login"

[services.env]
PORT = "21203"
